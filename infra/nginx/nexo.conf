# Copie para /etc/nginx/sites-available/nexo e ligue em sites-enabled.
# Troque nexo.example.com e REPO_PATH. TLS: sudo certbot --nginx -d nexo.example.com
server {
    listen 80;
    server_name nexo.example.com;

    root REPO_PATH/apps/web/dist;
    index index.html;

    client_max_body_size 25m;   # uploads de assets/importações; ajuste aos limites da API

    # API: /api/* -> Fastify em 127.0.0.1:3333 (prefixo /api removido, como no proxy do Vite)
    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (react-router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Necessário para o header Connection acima (colocar em contexto http, ex.: conf.d/):
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
