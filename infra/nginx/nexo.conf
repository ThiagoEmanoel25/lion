# Copie para /etc/nginx/sites-available/nexo e ligue em sites-enabled.
# Copie também nexo-security-headers.conf para /etc/nginx/snippets/.
# Troque nexo.example.com e REPO_PATH. Certificado: sudo certbot certonly --webroot -w /var/www/certbot -d nexo.example.com
# (ou --nginx). Veja docs/DEPLOY-VPS.md, seção "TLS e headers".
server_tokens off;

# Necessário para o header Connection abaixo (este arquivo é incluído em contexto http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: só redireciona para HTTPS (mantém o desafio ACME do certbot)
server {
    listen 80;
    server_name nexo.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nexo.example.com;

    # Caminhos padrão do certbot (placeholders: gerados por `certbot`, nada é criado aqui)
    ssl_certificate     /etc/letsencrypt/live/nexo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root REPO_PATH/apps/web/dist;
    index index.html;

    client_max_body_size 25m;   # uploads de assets/importações; ajuste aos limites da API

    # API: /api/* -> Fastify em 127.0.0.1:3333 (prefixo /api removido, como no proxy do Vite)
    # Os demais headers de segurança vêm do @fastify/helmet (evita duplicar); aqui só o HSTS.
    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/nexo-security-headers.conf;
        try_files $uri =404;
    }

    # SPA (react-router)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/nexo-security-headers.conf;
        try_files $uri /index.html;
    }
}
