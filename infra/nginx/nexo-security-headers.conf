# Copie para /etc/nginx/snippets/nexo-security-headers.conf (incluído por nexo.conf).
# add_header em um location SOBRESCREVE os do server: por isso cada location estático faz include deste arquivo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # sem "preload" por padrão
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# CSP do SPA em Report-Only. Depois de revisar os relatórios no console, troque o nome do header por Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
