# Config HTTP-ONLY inicial (usada pelo scripts/vps-bootstrap.sh ate o certificado existir).
# Contem so o desafio ACME do certbot e um proxy provisorio. NAO ha redirecionamento para HTTPS aqui
# (o bloco 443 ainda nao tem certificado). O bootstrap troca por infra/nginx/nexo.conf depois do certbot.
# Placeholders: nexo.example.com (host) e REPO_PATH (diretorio do app).
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nexo.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location / {
        root REPO_PATH/apps/web/dist;
        try_files $uri /index.html;
    }
}
