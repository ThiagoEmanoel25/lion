name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Testes com cobertura (text-summary + lcov)
        run: npm run test:coverage
      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: warn
      - run: npm run build

  audit:
    name: Auditoria de dependências (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate bloqueante: high ou critical (zod migrado para 4.x na task 21).
      - name: npm audit (bloqueia em high)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E Playwright (com prints)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexo
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Valores descartáveis, só para o banco efêmero do CI (não são segredos reais).
      NODE_ENV: development
      API_PORT: 3333
      WEB_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgresql://nexo:nexo@127.0.0.1:5432/nexo?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1maWVsZC1rZXktMzItYnl0ZXMtcGFkZGluZyE=
      # Suítes E2E longas fazem muitos logins: afrouxa os limites só neste banco/servidor de teste.
      LOGIN_RATE_MAX: 1000
      LOGIN_LOCKOUT_MAX_FAILS: 1000
      INVITE_RATE_MAX: 1000
      RESET_RATE_MAX: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      # Testes de isolamento multi-tenant (script criado em paralelo; --if-present até existir em todos os branches).
      - name: Testes de isolamento (API)
        env:
          TEST_DATABASE_URL: postgresql://nexo:nexo@127.0.0.1:5432/nexo?schema=public
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:isolation -w @nexo/api --if-present
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Prints das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
      - name: Relatório e traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/report/
            e2e/results/
          if-no-files-found: ignore
